<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Roi — Hors connexion</title>
  <meta name="theme-color" content="#D4AF37" />
  <link rel="icon" href="/icons/icon-192.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }

    .container {
      max-width: 420px;
      width: 100%;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 2rem;
      border-radius: 1rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #D4AF37;
      margin-bottom: 0.75rem;
      line-height: 1.2;
    }

    p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #D4AF37;
      color: #0a0a0a;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.875rem 2rem;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      min-height: 48px;
    }

    .btn-retry:hover { background: #e5c04b; }
    .btn-retry:active { transform: scale(0.97); }

    .btn-retry svg {
      width: 18px;
      height: 18px;
    }

    .contact {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .contact p {
      font-size: 0.875rem;
      margin-bottom: 0.75rem;
    }

    .contact a {
      color: #D4AF37;
      text-decoration: none;
      font-weight: 500;
    }

    .contact a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/icons/icon-192.png" alt="Auto Roi" class="logo" />

    <h1>Vous êtes hors connexion</h1>
    <p>
      Vérifiez votre connexion Internet et réessayez.
      Les pages déjà visitées restent disponibles.
    </p>

    <button class="btn-retry" onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
        <path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
      </svg>
      Réessayer
    </button>

    <div class="contact">
      <p>Besoin d'aide ? Contactez-nous :</p>
      <p>
        <a href="tel:+33600000000">06 00 00 00 00</a>
      </p>
    </div>
  </div>
</body>
</html>
